services:
  v2prodock:
    build: .
    image: v2prodock/proxy:latest
    container_name: v2prodock
    restart: unless-stopped
    networks:
      - v2prodock-proxy-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "27000-27100:27000-27100"   # Dynamic proxy ports (SOCKS5 + HTTP)
      - "27018:27018"               # API
    volumes:
      - ./config:/root/config
    environment:
      - SUBSCRIPTION_URL=${SUBSCRIPTION_URL:-}
      - SUBSCRIPTION_URLS=${SUBSCRIPTION_URLS:-}
      - HEALTH_CHECK_URL=${HEALTH_CHECK_URL:-https://www.gstatic.com/generate_204}
      - PROXY_INSTANCES=${PROXY_INSTANCES:-1}
      - PORT_BASE=${PORT_BASE:-27019}
      - API_PORT=${API_PORT:-27018}
      - XRAY_DIR=${XRAY_DIR:-/root/xray}
      - GOGC=${GOGC:-100}
      - GOMEMLIMIT=${GOMEMLIMIT:-128MiB}
      - MAX_CONNS=${MAX_CONNS:-128}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NO_PROXY=127.0.0.1,localhost,host.docker.internal,192.168.0.0/16,172.16.0.0/12,10.0.0.0/8
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # IKEv2 + L2TP/IPsec (+ opt-in PPTP) gateway for legacy devices.
  # Single gateway on UDP 500/4500 (+1701 for L2TP, +1723/tcp for PPTP);
  # client traffic is forced via tun0 into the fastest ALIVE Xray SOCKS
  # (fail-closed). Disable with VPN_ENABLED=0 (proxy-only mode stays green).
  # NOTE: PPTP also needs GRE (IP proto 47), which Docker ports: cannot
  # publish. On a Linux host (e.g. Ubuntu 24.04 VM) the host conntrack helper
  # nf_conntrack_pptp usually forwards GRE to the container once TCP 1723 is
  # DNATed; if GRE stalls, run this service with network_mode: host instead.
  v2prodock-vpn:
    build: ./vpn-gateway
    image: v2prodock/vpn-gateway:latest
    container_name: v2prodock-vpn
    hostname: v2prodock-vpn
    restart: unless-stopped
    depends_on:
      - v2prodock
    networks:
      - v2prodock-proxy-net
    ports:
      - "500:500/udp"
      - "4500:4500/udp"
      - "1701:1701/udp"
      - "1723:1723/tcp"
    volumes:
      - ./config:/config
    # NET_ADMIN: iptables/policy routing. MKNOD: create /dev/ppp.
    # SYS_ADMIN: pppd line discipline (TIOCSETD) - proven minimal set,
    # verified end-to-end (no --privileged needed).
    cap_add:
      - NET_ADMIN
      - MKNOD
      - SYS_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # ppp device access WITHOUT requiring the node on the host (entrypoint
    # creates it via mknod). Safe when the host kernel lacks ppp: boot then
    # fails fast with a clear message instead of a broken L2TP.
    device_cgroup_rules:
      - 'c 108:0 rwm'
    sysctls:
      net.ipv4.ip_forward: "1"
    environment:
      - VPN_ENABLED=${VPN_ENABLED:-0}
      - VPN_DOMAIN=${VPN_DOMAIN:-vpn.local}
      - VPN_SUBNET=${VPN_SUBNET:-10.10.10.0/24}
      - VPN_DNS=${VPN_DNS:-1.1.1.1,8.8.8.8}
      - VPN_USER=${VPN_USER:-vpnuser}
      - VPN_PASSWORD=${VPN_PASSWORD:-}
      - VPN_USERS=${VPN_USERS:-}
      - VPN_IPSEC_PSK=${VPN_IPSEC_PSK:-}
      - VPN_EXTRA_SANS=${VPN_EXTRA_SANS:-}
      - VPN_L2TP_NET=${VPN_L2TP_NET:-10.10.11.0/24}
      - VPN_L2TP_LOCAL=${VPN_L2TP_LOCAL:-10.10.11.1}
      - VPN_L2TP_RANGE=${VPN_L2TP_RANGE:-10.10.11.10-10.10.11.100}
      - VPN_ALLOW_PLAIN_L2TP=${VPN_ALLOW_PLAIN_L2TP:-0}
      - VPN_ENABLE_PPTP=${VPN_ENABLE_PPTP:-0}
      - VPN_PPTP_NET=${VPN_PPTP_NET:-10.10.12.0/24}
      - VPN_PPTP_LOCAL=${VPN_PPTP_LOCAL:-10.10.12.1}
      - VPN_PPTP_RANGE=${VPN_PPTP_RANGE:-10.10.12.10-10.10.12.100}
      - V2PRODOCK_API=http://v2prodock:27018/proxies
      - V2PRODOCK_SOCKS_HOST=v2prodock
      - TUN_DEV=${VPN_TUN_DEV:-tun0}
      - TUN_ADDR=${VPN_TUN_ADDR:-198.18.0.1}
      - PERSIST_DIR=/config/vpn
    healthcheck:
      test: ["CMD-SHELL", "swanctl --list-sas >/dev/null 2>&1 || swanctl --list-conns 2>&1 | grep -q ikev2-eap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  v2prodock-proxy-net:
    driver: bridge
